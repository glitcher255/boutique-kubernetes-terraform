loki:
  commonConfig:
    replication_factor: 1

  auth_enabled: false

  # storage:
  #   type: filesystem
  #   bucketNames:
  #     chunks: loki-chunks
  #     ruler: loki-ruler
  #     admin: loki-admin
  #   filesystem:
  #     directory: /var/loki
      
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3   # filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  pattern_ingester:
      enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

minio:
  enabled: true

# gateway:
#   enabled: false

# resultsCache:
#   enabled: false

chunksCache:
  enabled: false