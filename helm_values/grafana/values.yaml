grafana:
  # adminPassword: ""
  service:
    type: ClusterIP

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway
      isDefault: false
      editable: true

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      isDefault: false
      editable: true

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default-receiver
    receivers:
      - name: default-receiver
        slack_configs:
          - api_url: ${SLACK_URI}
            channel: "#alerts"
            send_resolved: true